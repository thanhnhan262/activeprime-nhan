[tool.pytest.ini_options]
testpaths = ["tests"]
base_url = "http://localhost:8080"
addopts = [
    "-ra",
    "--strict-markers",
    "--tracing=retain-on-failure",
    "--screenshot=only-on-failure",
    "--output=test-results",
    "--alluredir=allure-results",
    "--clean-alluredir",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
